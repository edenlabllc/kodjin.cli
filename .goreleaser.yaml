# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: kodjin-cli

builds:
  - builder: rust
    flags:
      - --release
    targets:
      - x86_64-unknown-linux-musl
      - x86_64-pc-windows-gnu
      - aarch64-unknown-linux-musl
      - aarch64-apple-darwin
      - x86_64-apple-darwin

archives:
  - formats: [tar.gz]
    id: kodjin-cli
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

blobs:
  # Version-pinned artifacts, e.g. kodjin-cli/0.2.0/. Published for every release,
  # including release candidates, which land under kodjin-cli/0.2.0-rc/.
  - bucket: edenlabllc-kodjin-cli
    provider: s3
    region: eu-north-1
    ids:
      - kodjin-cli

  # Stable channel, moved only by tagged releases merged into master.
  - bucket: edenlabllc-kodjin-cli
    provider: s3
    region: eu-north-1
    directory: "{{ .ProjectName }}/latest"
    disable: '{{ envOrDefault "DISABLE_BLOB_KODJIN_CLI" "false" }}'
    ids:
      - kodjin-cli

  # Release candidate channel, moved only by pushes to release/* and hotfix/*.
  - bucket: edenlabllc-kodjin-cli
    provider: s3
    region: eu-north-1
    directory: "{{ .ProjectName }}/latest-rc"
    disable: '{{ envOrDefault "DISABLE_BLOB_KODJIN_CLI_RC" "false" }}'
    ids:
      - kodjin-cli

  - bucket: edenlabllc-kodjin-cli
    provider: s3
    region: eu-north-1
    directory: "{{ .ProjectName }}"
    disable: '{{ envOrDefault "DISABLE_BLOB_KODJIN_CLI" "false" }}'
    extra_files:
      - glob: ./installer.sh
    extra_files_only: true

release:
  replace_existing_artifacts: true
  prerelease: auto
  name_template: "{{ .ProjectName }}-{{ .Tag }}"
  header: |
    ## Release notes

    {{ envOrDefault "RELEASE_NOTES" "" }}
  footer: |
    ---

    Install this version:

    ```
    curl -fsSL "https://edenlabllc-kodjin-cli.s3.eu-north-1.amazonaws.com/kodjin-cli/installer.sh" | bash -s -- {{ .Tag }}
    ```

    Update an existing installation:

    ```
    kodjin-cli update {{ .Tag }}
    ```
