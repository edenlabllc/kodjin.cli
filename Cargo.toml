[package]
name = "kodjin-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
# async-compression = { version = "0.4.12", features = ["futures-io", "gzip"] }
async-trait = "0.1.81"
chrono = "0.4.38"
clap = { version = "4.5.11", features = ["derive"] }
clap_complete = "4.5.33"
colored_json = "5.0.0"
console = "0.16.0"
deno_npm = "0.21.4"
deno_semver = "0.5.7"
dirs = "6.0.0"
fs_extra = "1.3.0"
futures = "0.3.30"
indexmap = { version = "2.10.0", features = ["serde"] }
indicatif = "0.18.0"
libflate = "2.1.0"
# pretty_assertions = "1.4.0"
reqwest = { version = "0.12.5", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_with = "3.9.0"
tar = "0.4.41"
tokio = { version = "1.39.2", features = ["macros", "net", "rt"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
