[package]
name = "kodjin-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.11", features = ["derive"] }
console = "0.15.8"
dirs = "5.0.1"
indexmap = { version = "2.3.0", features = ["serde"] }
indicatif = "0.17.8"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
# termcolor = "1.4.1"
# toml = "0.8.16"
ureq = { version = "2.10.0", features = ["brotli", "json"] }
