[package]
name = "kodjin-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.81"
clap = { version = "4.5.11", features = ["derive"] }
console = "0.15.8"
deno_npm = "0.21.4"
dirs = "5.0.1"
indexmap = { version = "2.3.0", features = ["serde"] }
indicatif = "0.17.8"
# pretty_assertions = "1.4.0"
reqwest = { version = "0.12.5", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.39.2", features = ["macros", "net", "rt"] }
