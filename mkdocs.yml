site_name: Kodjin CLI Documentation
site_description: Kodjin CLI is a command-line tool designed to simplify the process of downloading, installing, and managing FHIR Implementation Guides (IGs) for FHIR servers.
site_url: https://edenlabllc.github.io/kodjin.cli
copyright: © EDENLAB. ALL RIGHTS RESERVED, 2021 - 2026

# Repo Information
repo_name: edenlabllc/kodjin.cli
repo_url: https://github.com/edenlabllc/kodjin.cli

#Theme
theme:
  custom_dir: docs/theme_overwrites_home
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.top
  palette:
    primary: grey
    accent: deep orange
  font:
    text: Montserrat

plugins:
  - awesome-pages   # lets nav be inferred from folder structure — skip the manual `nav:` block
  - git-revision-date-localized:
      type: date
  - include-markdown
  - mike:
      version_selector: true
      css_dir: static/css
      javascript_dir: static/js
      canonical_version: null
  - search

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/edenlab-it/
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/edenlabIT
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/EdenlabIT
  version:
    provider: mike
    default: latest
markdown_extensions:
  - pymdownx.superfences # https://squidfunk.github.io/mkdocs-material/extensions/pymdown/#superfences
  - admonition

extra_css:
    - stylesheets/extra.css

strict: true
