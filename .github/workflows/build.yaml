name: Build binaries

on:
  push:
    tags:
      - "*"
    branches: ['master']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: messense/cargo-zigbuild:0.20.0

    steps:
      - name: Install dependencies
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | tee /etc/apt/sources.list.d/goreleaser.list
          apt update 
          apt install -y mingw-w64 goreleaser
          git config --global --add safe.directory $PWD

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-north-1
          aws-access-key-id: ${{ secrets.KODJIN_CLI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.KODJIN_CLI_AWS_SECRET_ACCESS_KEY }}

      - name: Set up build cache
        uses: Swatinem/rust-cache@v2

      - name: Build and release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nightly
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: |
          goreleaser build --clean --snapshot
          mkdir -p artifacts/dist
          for file in dist/*/kodjin-cli; do
              mv "$file" "./artifacts/$(dirname "$file")"
          done

      - name: Create nightly release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: ncipollo/release-action@v1.14.0
        with:
          removeArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: false
          artifacts: "artifacts/dist/*"
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          name: Nightly release
          tag: nightly

      - name: Update the nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly
